
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleming Saúde - Inteligência em Longevidade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              fleming: {
                dark: '#436d2e',
                light: '#a8c546',
                gray: '#7a7a7a'
              }
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        
        @media print {
            @page { 
                size: A4; 
                margin: 1cm; 
            }
            body { 
                background: white !important; 
                color: black !important;
                font-size: 10pt; 
            }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            
            img {
                max-width: 100% !important;
                image-rendering: -webkit-optimize-contrast;
            }

            main { width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .max-w-7xl, .max-w-6xl { max-width: 100% !important; width: 100% !important; }
            
            .bg-white { background: white !important; border: 1px solid #f0f0f0 !important; box-shadow: none !important; }
            .shadow-xl, .shadow-2xl, .shadow-sm { box-shadow: none !important; }
            .rounded-[2.5rem], .rounded-[3rem], .rounded-3xl { border-radius: 12px !important; }
            
            .text-fleming-dark { color: #436d2e !important; }
            .bg-fleming-dark { background-color: #436d2e !important; color: white !important; }
            .border-fleming-dark { border-color: #436d2e !important; }
            
            .break-inside-avoid { break-inside: avoid; page-break-inside: avoid; }
            .blur-lg, .blur-3xl { display: none !important; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
<script type="importmap">
